    <style>
        .projects-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 30px 20px;
            gap: 25px;
        }
        .project-card {
            background: linear-gradient(145deg, #1e1e2e, #25252f);
            color: #fff;
            border-radius: 16px;
            overflow: hidden;
            width: 350px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
        }
        .project-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(168,45,255,0.4), 0 0 30px rgba(2,250,242,0.2);
            border-color: rgba(168,45,255,0.3);
        }
        .project-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            transition: transform 0.4s ease;
        }
        .project-card:hover img {
            transform: scale(1.08);
        }
        .card-content {
            
            padding: 20px;
        }
        .card-content h3 {
           

            font-size: 1.1rem;
            margin-bottom: 12px;
            font-family: orbitron;
            color: #02faf2;
        }
        .card-content h3 strong {
            color: #a82dff;
            font-size: 0.9rem;
        }
        .card-content p {
            font-size: 0.95rem;
            line-height: 1.5;
            color: rgba(255,255,255,0.8);
            overflow: hidden;
            max-height: 4.5em;
            transition: max-height 0.3s ease;
        }
        .project-card:hover p {
            max-height: 20em;
        }
        .card-content p strong {
            color: #2d7ecf;
        }
    </style>
</head>

    <script>
        // Typewriter effect implementation
        const sentence = "Showcasing Brilliance - The Projects That Define Us!";
        const speed = 100; // Typing speed in milliseconds
        let index = 0;
    
        function typeWriter() {
            if (index < sentence.length) {
                document.getElementById("typewriter").innerHTML += sentence.charAt(index);
                index++;
                setTimeout(typeWriter, speed);
            }
        }
    
        // Start the typewriter effect when the page loads
        window.onload = typeWriter;
    </script>
